<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="description" content="Checklist compartida en tiempo real del equipo de Nero Salamanca para preparar eventos.">
<title>Nero · Eventos — Checklist compartida</title>
<link rel="icon" href="assets/logo-nero.png">
<link rel="apple-touch-icon" href="assets/logo-nero.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Jost', sans-serif;
    background: #0e0e0e;
    background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0e0e0e 60%);
    background-attachment: fixed;
    margin: 0;
    padding: 34px 18px calc(60px + env(safe-area-inset-bottom));
    color: #e9e4d8;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  .crest { text-align: center; margin-bottom: 2px; }
  .crest img { height: 40px; width: auto; opacity: 0.9; display: inline-block; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 28px;
    text-align: center;
    letter-spacing: 2px;
    margin: 8px 0 2px;
    color: #f4ead2;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #9c9587;
    margin-bottom: 14px;
    font-weight: 300;
  }
  .divider { width: 40px; height: 1px; background: #b08d4f; margin: 18px auto 26px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 30px;
    border-bottom: 1px solid #24221e;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
    min-height: 52px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b6459;
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    font-family: 'Jost', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .tab .tab-main { display: block; font-family: 'Playfair Display', serif; font-size: 14px; letter-spacing: 0.5px; text-transform: none; margin-bottom: 2px; }
  .tab.active { color: #f4ead2; border-bottom-color: #b08d4f; }
  .tab.active .tab-main { color: #b08d4f; }

  .section-note {
    text-align: center;
    font-size: 11px;
    font-style: italic;
    color: #6b6459;
    margin-bottom: 20px;
  }

  .who-row { margin-bottom: 18px; }
  .who-label {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #8a8378;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 2px;
    border: 1px solid #2c2a26;
    background: #161513;
    color: #e9e4d8;
    /* 16px evita que iOS haga zoom al enfocar el campo */
    font-size: 16px;
    font-weight: 300;
    font-family: 'Jost', sans-serif;
  }
  input[type=text]::placeholder { color: #5f5a51; }
  input[type=text]:focus { outline: none; border-color: #b08d4f; }

  .add-row { display: flex; gap: 8px; margin-bottom: 26px; }
  .add-row input { flex: 1; min-width: 0; }
  button.add-btn {
    background: transparent;
    color: #b08d4f;
    border: 1px solid #b08d4f;
    border-radius: 2px;
    padding: 0 20px;
    min-height: 48px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.add-btn:hover { background: #b08d4f; color: #0e0e0e; }
  button.add-btn:active { transform: scale(0.97); }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    background: #161513;
    border: 1px solid #24221e;
    border-radius: 2px;
    padding: 10px 8px 10px 4px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  li:hover { border-color: #3a362e; }

  /* El botón es la zona táctil de 44px; el círculo dorado va dentro */
  .check-btn {
    flex-shrink: 0;
    width: 46px;
    min-height: 46px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .checkbox {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #b08d4f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    color: #0e0e0e;
  }
  .checkbox.done { background: #b08d4f; }

  .item-body { flex: 1; min-width: 0; padding: 4px 0; }

  .item-text {
    font-size: 15px;
    font-weight: 300;
    word-break: break-word;
    line-height: 1.4;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .item-text:hover { border-bottom: 1px dashed #48443c; }
  .item-text.done { text-decoration: line-through; color: #5f5a51; }
  .item-text.editing { outline: none; border-bottom: 1px solid #b08d4f; text-decoration: none; color: #e9e4d8; }

  .item-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }
  .item-author {
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6b6459;
  }

  /* La categoría es un <select> nativo disfrazado de etiqueta: en el móvil abre
     el selector del sistema, que es lo más cómodo con una mano. */
  .cat-select {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 1px solid #2c2a26;
    border-radius: 2px;
    color: #8a8378;
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 16px 4px 7px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #6b6459 50%), linear-gradient(135deg, #6b6459 50%, transparent 50%);
    background-position: calc(100% - 8px) calc(50% + 1px), calc(100% - 5px) calc(50% + 1px);
    background-size: 3px 3px, 3px 3px;
    background-repeat: no-repeat;
  }
  .cat-select:focus { outline: none; border-color: #b08d4f; color: #b08d4f; }
  .cat-select option, .cat-select optgroup { background: #161513; color: #e9e4d8; }
  .del-btn {
    flex-shrink: 0;
    width: 44px;
    min-height: 44px;
    background: none;
    border: none;
    color: #48443c;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    font-family: 'Playfair Display', serif;
    -webkit-tap-highlight-color: transparent;
  }
  .del-btn:hover { color: #b08d4f; }

  .empty {
    text-align: center;
    color: #6b6459;
    font-size: 14px;
    font-style: italic;
    padding: 40px 0;
    font-family: 'Playfair Display', serif;
  }

  /* ---- Filtros ---- */
  .filters { margin-bottom: 22px; }

  .filter-label {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #565148;
    margin-bottom: 7px;
  }

  /* Estado: control segmentado a todo el ancho */
  .seg {
    display: flex;
    border: 1px solid #24221e;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .seg button {
    flex: 1;
    min-height: 44px;
    background: transparent;
    border: none;
    border-right: 1px solid #24221e;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: #b08d4f; color: #0e0e0e; }

  /* Categorías: fichas que se ajustan solas */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.sub { margin-top: 8px; padding-left: 14px; border-left: 1px solid #24221e; }
  .chip {
    min-height: 40px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #24221e;
    border-radius: 2px;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip .chip-count { color: #48443c; margin-left: 5px; }
  .chip.active { border-color: #b08d4f; color: #f4ead2; }
  .chip.active .chip-count { color: #b08d4f; }
  .chip:disabled { opacity: 0.35; cursor: default; }

  .filter-reset {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
    min-height: 32px;
  }
  .filter-reset:hover { color: #b08d4f; }

  .add-note {
    display: none;
    font-size: 11px;
    color: #c17d5a;
    font-style: italic;
    margin: -18px 0 20px;
    text-align: center;
  }

  .status {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b6459;
    margin-top: 26px;
  }

  .hint {
    text-align: center;
    font-size: 10px;
    color: #4c473f;
    margin-top: 6px;
    font-style: italic;
  }

  .name-warning {
    display: none;
    font-size: 11px;
    color: #c17d5a;
    margin-top: 6px;
    font-style: italic;
  }

  .item-history {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #24221e;
  }
  .item-history-entry {
    font-size: 10px;
    color: #565148;
    line-height: 1.6;
  }

  .conn-status {
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #4c473f;
  }
  .conn-status.error { color: #c17d5a; }

  /* ---- Buscador general ---- */
  .search-block { margin-bottom: 26px; }
  .search-row { position: relative; }
  .search-row input { padding-left: 40px; padding-right: 44px; }
  .search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-54%);
    color: #6b6459;
    font-size: 19px;
    line-height: 1;
    pointer-events: none;
  }
  .search-clear {
    position: absolute;
    right: 2px;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    min-height: 42px;
    background: none;
    border: none;
    color: #6b6459;
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .search-clear:hover { color: #b08d4f; }

  .dupes-btn {
    display: block;
    width: 100%;
    margin-top: 10px;
    min-height: 44px;
    background: transparent;
    border: 1px dashed #3a3225;
    border-radius: 2px;
    color: #8a8378;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dupes-btn:hover { border-color: #b08d4f; color: #b08d4f; }
  .dupes-btn.active { border-style: solid; border-color: #b08d4f; color: #b08d4f; }
  .dupes-btn .dupes-count { color: #b08d4f; margin-left: 6px; }

  .panel-title {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #8a8378;
    margin-bottom: 4px;
  }
  .panel-note {
    font-size: 11px;
    font-style: italic;
    color: #565148;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  /* Cada resultado es un botón: se toca y lleva a su lista */
  .res {
    display: block;
    width: 100%;
    text-align: left;
    background: #161513;
    border: 1px solid #24221e;
    border-radius: 2px;
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    font-family: 'Jost', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .res:hover { border-color: #3a362e; }
  .res-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 6px;
  }
  .res-sec {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #b08d4f;
    border: 1px solid #3a2f1c;
    border-radius: 2px;
    padding: 3px 7px;
  }
  .res-tag {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #6b6459;
  }
  .res-text {
    display: block;
    font-size: 15px;
    font-weight: 300;
    color: #e9e4d8;
    line-height: 1.4;
    word-break: break-word;
  }
  .res-text.done { text-decoration: line-through; color: #5f5a51; }
  .res-meta {
    display: block;
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #565148;
    margin-top: 6px;
  }

  .group {
    border: 1px solid #24221e;
    border-radius: 2px;
    padding: 12px 12px 4px;
    margin-bottom: 14px;
  }
  .group-title {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #b08d4f;
    margin-bottom: 10px;
  }
  .group .res { background: #1b1916; }

  /* El punto al que lleva un resultado parpadea un momento para no perderlo */
  @keyframes destello {
    0%, 100% { border-color: #24221e; background: #161513; }
    15%, 65% { border-color: #b08d4f; background: #1f1c16; }
  }
  li.destello { animation: destello 2.4s ease; }

  .dup-hint {
    display: none;
    font-size: 11px;
    font-style: italic;
    color: #8a8378;
    line-height: 1.7;
    margin: -14px 0 20px;
  }
  .dup-hint .dup-link {
    color: #e9e4d8;
    font-style: normal;
    text-decoration: underline;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dup-hint .dup-link:hover { color: #b08d4f; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crest">
    <img src="assets/logo-nero.png" alt="Nero Salamanca">
  </div>
  <h1>Nero · Eventos</h1>
  <div class="sub">Checklist compartida del equipo</div>
  <div class="conn-status" id="connStatus">Conectando...</div>
  <div class="divider"></div>

  <!-- El buscador está fuera de las pestañas a propósito: mira las tres listas -->
  <div class="search-block">
    <div class="search-row">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="text" id="searchInput" placeholder="Buscar en las tres listas..." enterkeyhint="search" autocomplete="off" />
      <button class="search-clear" id="searchClear" type="button" aria-label="Limpiar búsqueda" hidden>✕</button>
    </div>
    <button class="dupes-btn" id="dupesBtn" type="button" hidden></button>
  </div>

  <div id="searchPanel" hidden></div>

  <div id="sectionArea">
  <div class="tabs" id="tabs"></div>
  <div class="section-note" id="sectionNote"></div>

  <div class="who-row">
    <div class="who-label">Tu nombre</div>
    <input type="text" id="whoInput" placeholder="Ej: Selu" autocomplete="name" enterkeyhint="done" />
    <div class="name-warning" id="nameWarning">Pon tu nombre antes de apuntar algo</div>
  </div>

  <div class="add-row">
    <input type="text" id="newItem" placeholder="Añadir un punto a la lista..." enterkeyhint="done" />
    <button class="add-btn" id="addBtn" type="button">Añadir</button>
  </div>
  <div class="add-note" id="addNote"></div>
  <div class="dup-hint" id="dupHint"></div>

  <div class="filters">
    <div class="seg" id="filterEstado"></div>
    <div class="filter-label">Filtrar por tipo</div>
    <div class="chips" id="filterCat"></div>
    <div class="chips sub" id="filterSub" hidden></div>
    <button class="filter-reset" id="filterReset" type="button" hidden>Quitar filtros</button>
  </div>

  <ul id="list"></ul>
  <div class="status" id="status">Cargando...</div>
  <div class="hint">Toca el texto de un punto para editar la cantidad</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Claves públicas de cliente. No son secretos: Firebase las expone por diseño en
// el navegador y la seguridad real vive en las reglas de Firestore (ver README).
const firebaseConfig = {
  apiKey: "AIzaSyBIv43-_3Mvn0mEPXO-yPU63NskYufUYaw",
  authDomain: "nero-eventos.firebaseapp.com",
  projectId: "nero-eventos",
  storageBucket: "nero-eventos.firebasestorage.app",
  messagingSenderId: "952289724967",
  appId: "1:952289724967:web:a5a818e2d7e3a1c2d3dc02"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Para añadir o renombrar una pestaña, toca solo este array.
const SECTIONS = [
  { key: 'general',    title: 'General',    label: 'General',      cats: 'sala',   note: '(material y suministros generales del evento)' },
  { key: 'cocteleria', title: 'Coctelería', label: 'José Alexis',  cats: 'sala',   note: '(por si quieren apuntar algo, desgraciados)' },
  { key: 'cocina',     title: 'Cocina',     label: 'Jordan',       cats: 'cocina', note: '(por si quieren apuntar algo, desgraciados)' }
];

const NAME_STORAGE_KEY = 'nero-eventos:nombre';

// Categorías, por juego. Sala (general y coctelería) y cocina no tienen nada que ver:
// lo que a Jordan le sirve es máquinas / género / menaje, no vinos y licores.
// Para añadir una categoría basta con meterla aquí: aparece sola en los filtros y en
// el selector de cada punto. `subs: null` = sin subfiltros.
const CATS_SALA = {
  bebidas:    { label: 'Bebidas',    subs: { refrescos: 'Refrescos', vinos: 'Vinos', licores: 'Licores', otros: 'Otras' } },
  utensilios: { label: 'Utensilios', subs: null },
  otros:      { label: 'Otros',      subs: null }
};

const CATS_COCINA = {
  genero:     { label: 'Género',     subs: { salsas: 'Salsas', charcuteria: 'Charcutería', congelados: 'Congelados', otros: 'Otros' } },
  maquinas:   { label: 'Máquinas',   subs: null },
  utensilios: { label: 'Utensilios', subs: null },
  menaje:     { label: 'Menaje',     subs: null },
  limpieza:   { label: 'Limpieza',   subs: null },
  otros:      { label: 'Otros',      subs: null }
};

// Reglas de clasificación automática para lo que se apunte de nuevo. Se miran en
// orden y gana la primera que encaje, así que lo más específico va arriba.
const REGLAS_SALA = [
  { cat: 'bebidas', sub: 'licores', kw: ['ron','barcelo','bacardi','ginebra','gin','beefeater','tanqueray','larios','seagrams','whisky','whiskey','ballantines','jb','dyc','vodka','absolut','smirnoff','martini','vermut','vermouth','licor','tequila','brandy','conac','cognac','orujo','pacharan','anis','cointreau','curacao','amaretto','baileys','jager','absenta','cazalla','ponche','chinchon'] },
  { cat: 'bebidas', sub: 'vinos',     kw: ['vino','vinos','verdejo','yllera','hillera','tinto','tintos','blanco','rioja','ribera','albarino','rueda','cava','champagne','champan','espumoso','rosado','crianza','reserva','godello','tempranillo','moscatel','sidra','sangria','tinto de verano'] },
  { cat: 'bebidas', sub: 'refrescos', kw: ['agua','aguas','pepsi','coca','cola','tonica','tonicas','fanta','sprite','refresco','refrescos','zumo','zumos','nestea','aquarius','bitter','kas','schweppes','trina','gaseosa','limonada','mosto','energetica','isotonica'] },

// El juego de categorías depende de la pestaña. Casi siempre es la abierta, pero
// el buscador pinta puntos de las tres, y cada uno hay que leerlo con las categorías
// de su lista (lo que en cocina es "Género" en general no existe).
function juegoDe(sectionKey) {
  const s = SECTIONS.find(x => x.key === sectionKey);
  return CAT_SETS[(s && s.cats) || 'sala'];
}
function juegoActual() { return juegoDe(currentSection); }
function CATS_(sectionKey) { return juegoDe(sectionKey || currentSection).cats; }

function normalizar(t) {
  return (t || '').toLowerCase()
    .replace(/[áàäâ]/g, 'a').replace(/[éèëê]/g, 'e').replace(/[íìïî]/g, 'i')
    .replace(/[óòöô]/g, 'o').replace(/[úùüû]/g, 'u')
    .replace(/ñ/g, 'n').replace(/ç/g, 'c');
}

// Clasifica por palabras completas: así "colador" no cae en refrescos por "cola",
// ni "salsa" en otros por "sal".
function clasificar(text, juego) {
  const reglas = (juego || juegoActual()).reglas;
  const t = normalizar(text);
  for (const regla of reglas) {
    for (const kw of regla.kw) {
      if (new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t)) {
        return { cat: regla.cat, sub: regla.sub };
      }
    }
  }
  return { cat: 'otros', sub: null };   // "otros" existe en todos los juegos
}

// Los puntos apuntados antes de que existieran los filtros no tienen categoría
// guardada: se les calcula al vuelo, sin escribir en Firestore (si no, cada móvil
// que abriera la app dispararía una escritura).
function catDe(item, sectionKey) {
  const CATS = CATS_(sectionKey);
  // Una categoría guardada que no exista en esta pestaña (p. ej. "bebidas" en cocina)
  // se ignora y se reclasifica con las reglas de aquí.
  if (item.cat && CATS[item.cat]) return item.cat;
  return clasificar(item.text, juegoDe(sectionKey || currentSection)).cat;
}
function subDe(item, sectionKey) {
  const juego = juegoDe(sectionKey || currentSection);
  const CATS = juego.cats;
  const cat = catDe(item, sectionKey);
  if (!CATS[cat].subs) return null;
  if (item.cat === cat && item.sub && CATS[cat].subs[item.sub]) return item.sub;
  const auto = clasificar(item.text, juego);
  return auto.cat === cat && auto.sub ? auto.sub : 'otros';
}
function nombreCat(item, sectionKey) {
  const CATS = CATS_(sectionKey);
  const cat = catDe(item, sectionKey), sub = subDe(item, sectionKey);
  return CATS[cat].label + (sub ? ' · ' + CATS[cat].subs[sub] : '');
}

/* ---------------------------------------------------------------------------
   Motor de parecidos

   El problema real de estas listas: el mismo artículo lo escribe cada uno a su
   manera — "quezos 4 de cada", "Queso brie", "4 quesos" — y acaba apuntado dos
   veces en dos pestañas distintas. Para saber si dos puntos hablan del mismo
   artículo hay que quitarles lo que no es el artículo (cantidades, envases,
   palabras de relleno) y comparar lo que queda por cómo suena, no por cómo se
   escribe.
--------------------------------------------------------------------------- */

// Palabras que no dicen nada del artículo
const RELLENO = new Set([
  'de','del','la','el','lo','los','las','un','una','unos','unas','y','e','o','u',
  'con','sin','para','por','en','al','a','cada','mas','tipo','varios','varias',
  'aprox','algo','algun','alguna','tambien','otro','otra','otros','otras'
]);

// Plurales fuera: "limones" y "limón" son lo mismo. En palabras cortas no se toca
// ("gas" no es "ga").
function singular(s) {
  if (s.length > 4 && s.endsWith('es')) return s.slice(0, -2);
  if (s.length > 3 && s.endsWith('s')) return s.slice(0, -1);
  return s;
}

// Clave de cómo suena una palabra en español. Junta las confusiones típicas al
// escribir deprisa en el móvil: z/s/c ("quezo" = "queso"), b/v y ll/y
// ("balletas" = "bayetas"), la h muda, qu/k, g/j.
function fonetica(palabra) {
  let s = singular(palabra.replace(/[^a-z0-9]/g, ''));
  if (!s) return '';
  return s
    .replace(/ch/g, '1')          // la "ch" es un sonido propio: se aparta antes de tocar las haches
    .replace(/h/g, '')
    .replace(/qu/g, 'k')
    .replace(/c([ei])/g, 's$1')   // "cerveza" suena "serveza"
    .replace(/[qck]/g, 'k')
    .replace(/z/g, 's')
    .replace(/x/g, 's')
    .replace(/v/g, 'b')
    .replace(/ll/g, 'y')
    .replace(/g([ei])/g, 'j$1')
    .replace(/(.)\1+/g, '$1')     // letras dobladas
    .replace(/1/g, 'ch');
}

// Envases y medidas: dicen cuánto, no qué. "3 cajas de agua" y "agua" son lo mismo,
// así que estas palabras pesan poco. Ojo: aquí no van "bandeja" ni "bolsa", que en
// estas listas son artículos de pleno derecho.
const ENVASE = new Set([
  'caja','botella','bote','lata','paquete','pack','barril','kilo','kg','gramo','gr',
  'litro','cl','ml','docena','unidad','ud','uds','media','medio','par'
].map(fonetica));

// Trocear un texto sale caro y se repite mucho (cada comparación, cada tecla en el
// buscador), así que se guarda hecho.
const cacheTokens = new Map();

function tokens(text) {
  const yaHecho = cacheTokens.get(text);
  if (yaHecho) return yaHecho;

  const out = [], vistos = new Set();
  for (let bruto of normalizar(text).split(/[^a-z0-9]+/)) {
    if (!bruto) continue;
    bruto = bruto.replace(/^\d+/, '');       // "200ud", "2kg": la cifra no dice qué artículo es
    if (!bruto || RELLENO.has(bruto)) continue;
    const clave = fonetica(bruto);
    if (!clave || vistos.has(clave)) continue;
    vistos.add(clave);
    out.push({ clave, envase: ENVASE.has(clave) });
  }

  if (cacheTokens.size > 600) cacheTokens.clear();
  cacheTokens.set(text, out);
  return out;
}

// Cuánto distingue cada palabra, medido sobre las propias listas: si "salsa" y
// "biberón" salen en ocho puntos, no sirven para saber cuál es cuál; "brie", que
// sale una vez, es justo lo que separa un queso de otro. Sin esto los ocho
// "Biberón salsa X" de Jordan saldrían como repetidos entre sí.
let docsTotales = 1;
let frecuencia = new Map();

function recalcularPesos() {
  const df = new Map();
  let n = 0;
  SECTIONS.forEach(s => {
    (store[s.key] || []).forEach(item => {
      n++;
      tokens(item.text).forEach(t => df.set(t.clave, (df.get(t.clave) || 0) + 1));
    });
  });
  docsTotales = Math.max(n, 1);
  frecuencia = df;
}

function pesoDe(t) {
  const df = frecuencia.get(t.clave) || 0;
  const peso = Math.log((docsTotales + 1) / (df + 1)) + 0.4;
  return t.envase ? peso * 0.35 : peso;
}

function distancia(a, b) {
  const m = a.length, n = b.length;
  if (!m || !n) return m || n;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const fila = [i];
    for (let j = 1; j <= n; j++) {
      fila[j] = Math.min(prev[j] + 1, fila[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = fila;
  }
  return prev[n];
}

// Dos palabras se dan por la misma si suenan igual o si se diferencian en poco más
// de una letra. En las cortas no se perdona nada: "sal" y "sol" no son lo mismo.
function parecidoPalabra(a, b) {
  if (a === b) return 1;
  const max = Math.max(a.length, b.length);
  if (max < 5) return 0;
  const r = 1 - distancia(a, b) / max;
  return r >= 0.8 ? r : 0;
}

// Por debajo de esto salen parejas que no vienen a cuento ("Platos de café" con
// "Platos negros"); por encima se escapan los repetidos de verdad.
const UMBRAL_PARECIDO = 0.6;

// 0 = no tienen nada que ver, 1 = es lo mismo escrito de otra forma.
function similitud(textoA, textoB) {
  const A = tokens(textoA), B = tokens(textoB);
  if (!A.length || !B.length) return 0;

  const suma = (X, Y) => X.reduce((acc, x) =>
    acc + pesoDe(x) * Y.reduce((m, y) => Math.max(m, parecidoPalabra(x.clave, y.clave)), 0), 0);
  const total = X => X.reduce((acc, x) => acc + pesoDe(x), 0);

  const sA = suma(A, B), sB = suma(B, A);
  const tA = total(A), tB = total(B);
  const parecido = (sA + sB) / (tA + tB);

  // Cuando todo lo que dice un punto está dentro del otro hablan del mismo
  // artículo, aunque uno añada cosas: "limones" está entero dentro de "Fruta:
  // naranja y limón". Por reparto de pesos eso solo se quedaba en un 0,5.
  const contenido = (sA / tA > 0.98 && A.some(t => !t.envase)) ||
                    (sB / tB > 0.98 && B.some(t => !t.envase));
  return contenido ? Math.max(parecido, UMBRAL_PARECIDO + 0.05) : parecido;
}

// Buscar es otra cosa: lo que se escribe es un trozo, no un punto entero, así que
// vale con que cada palabra buscada aparezca en el punto (o empiece igual, para
// que vaya encontrando mientras se teclea).
function puntuaBusqueda(consulta, texto) {
  const q = normalizar(consulta).trim();
  const t = normalizar(texto);
  // Lo escrito tal cual, pero solo si empieza una palabra: buscar "ron" tiene que
  // sacar el ron, no los ocho "biberón" de la cocina.
  if (q && new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) {
    return { score: 1, exacto: true };
  }

  const Q = tokens(consulta), I = tokens(texto);
  if (!Q.length || !I.length) return { score: 0, exacto: false };

  let suma = 0, total = 0;
  for (const qt of Q) {
    const peso = pesoDe(qt);
    total += peso;
    let mejor = 0;
    for (const it of I) {
      const parcial = qt.clave.length >= 3 && it.clave.startsWith(qt.clave) ? 0.9 : 0;
      mejor = Math.max(mejor, parcial, parecidoPalabra(qt.clave, it.clave));
    }
    suma += peso * mejor;
  }
  return { score: total ? suma / total : 0, exacto: false };
}

  currentSection = key;

  // consigue que parezca vacía sin motivo.
  quitarFiltros();

async function arrancar() {
  // Si un documento aún no existe, se crea con su semilla. En transacción para
  // que dos móviles abriendo a la vez no se pisen la lista inicial.
  await Promise.all(SECTIONS.map(async (s) => {
    const ref = docRefFor(s.key);
    try {
      await runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists()) tx.set(ref, { items: seedFor(s.key) });
      });
    } catch (e) {
      setConnStatus('Error de conexión con Firebase', true);
    }
  }));

  // Se escuchan las tres a la vez y para siempre, en vez de enganchar y soltar el
  // listener al cambiar de pestaña. Son tres documentos pequeños: cuesta casi lo
  // mismo que escuchar uno, y a cambio el buscador tiene todo delante y cambiar de
  // pestaña es instantáneo.
  SECTIONS.forEach(s => {
    onSnapshot(docRefFor(s.key), (snap) => {
      store[s.key] = (snap.exists() && snap.data().items) || [];
      if (s.key === currentSection) items = store[s.key];
      datosCambiados();
      setConnStatus('Sincronizado en tiempo real', false);
    }, () => {
      setConnStatus('Error de conexión con Firebase', true);
    });
  });
}

function datosCambiados() {
  version++;
  recalcularPesos();
  render();
}

async function saveItems() {
  try {
    await setDoc(docRefFor(currentSection), { items });
  } catch (e) {
    document.getElementById('status').textContent = 'Error al guardar. Intenta de nuevo.';
  }
}

function currentName() {
  return document.getElementById('whoInput').value.trim();
}

function requireName() {
  const name = currentName();
  const warning = document.getElementById('nameWarning');
  if (!name) {
    warning.style.display = 'block';
    document.getElementById('whoInput').focus();
    return null;
  }
  warning.style.display = 'none';
  return name;
}

function pushHistory(item, text) {
  if (!Array.isArray(item.history)) item.history = [];
  item.history.push({ text, at: Date.now() });
}

function pasaFiltro(item) {
  if (fEstado === 'pendientes' && item.done) return false;
  if (fEstado === 'tachados' && !item.done) return false;
  if (fCat !== 'todas' && catDe(item) !== fCat) return false;
  if (fCat === 'bebidas' && fSub !== 'todas' && subDe(item) !== fSub) return false;
  return true;
}

function hayFiltro() {
  return fEstado !== 'todos' || fCat !== 'todas' || fSub !== 'todas';
}

// Cuenta cuántos puntos caerían en una categoría con el filtro de estado puesto,
// para poder enseñar el número en cada ficha.
function cuenta(fn) {
  return items.filter(i => {
    if (fEstado === 'pendientes' && i.done) return false;
    if (fEstado === 'tachados' && !i.done) return false;
    return fn(i);
  }).length;
}

function renderFiltros() {
  const CATS = CATS_();
  const seg = document.getElementById('filterEstado');
  seg.innerHTML = '';
  [['todos', 'Todos'], ['pendientes', 'Pendientes'], ['tachados', 'Tachados']].forEach(([k, label]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = fEstado === k ? 'active' : '';
    btn.textContent = label;
    btn.onclick = () => { fEstado = k; renderFiltros(); render(); };
    seg.appendChild(btn);
  });

  const catsEl = document.getElementById('filterCat');
  catsEl.innerHTML = '';
  const ficha = (activa, label, n, onClick) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (activa ? ' active' : '');
    btn.textContent = label;
    const c = document.createElement('span');
    c.className = 'chip-count';
    c.textContent = n;
    btn.appendChild(c);
    btn.disabled = n === 0 && !activa;
    btn.onclick = onClick;
    return btn;
  };

  catsEl.appendChild(ficha(fCat === 'todas', 'Todas', cuenta(() => true), () => {
    fCat = 'todas'; fSub = 'todas'; renderFiltros(); render();
  }));
  Object.keys(CATS).forEach(k => {
    catsEl.appendChild(ficha(fCat === k, CATS[k].label, cuenta(i => catDe(i) === k), () => {
      fCat = k; fSub = 'todas'; renderFiltros(); render();
    }));
  });

  // La fila de subfiltros solo tiene sentido dentro de una categoría que las tenga
  const subEl = document.getElementById('filterSub');
  const subs = fCat !== 'todas' && CATS[fCat] ? CATS[fCat].subs : null;
  subEl.hidden = !subs;
  subEl.innerHTML = '';
  if (subs) {
    subEl.appendChild(ficha(fSub === 'todas', 'Todas', cuenta(i => catDe(i) === fCat), () => {
      fSub = 'todas'; renderFiltros(); render();
    }));
    Object.keys(subs).forEach(sk => {
      subEl.appendChild(ficha(fSub === sk, subs[sk], cuenta(i => catDe(i) === fCat && subDe(i) === sk), () => {
        fSub = sk; renderFiltros(); render();
      }));
    });
  }

  document.getElementById('filterReset').hidden = !hayFiltro();
}

// Buscando (o mirando los repetidos) se esconde la pestaña entera: sus filtros y su
// lista son de una sola sección y aquí se está mirando en las tres, así que verlos
// a la vez solo confunde.
function modoBusqueda() {
  return verRepetidos || consulta.trim().length >= 2;
}

function render() {
  const buscando = modoBusqueda();
  document.getElementById('sectionArea').hidden = buscando;
  document.getElementById('searchPanel').hidden = !buscando;
  renderBotonRepetidos();
  if (buscando) renderPanel();
  else renderLista();
}

function renderLista() {
  const list = document.getElementById('list');
  const status = document.getElementById('status');

  // Si alguien está escribiendo en un punto o tiene abierto el selector de
  // categoría, no repintamos: le borraríamos lo que está haciendo cuando llega
  // un cambio de otro móvil.
  const active = document.activeElement;
  if (active && active.classList &&
      (active.classList.contains('item-text') || active.classList.contains('cat-select'))) return;

  list.innerHTML = '';
  const visibles = items.filter(pasaFiltro).length;

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada por aquí todavía';
    list.appendChild(empty);
  } else if (visibles === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada en este filtro';
    list.appendChild(empty);
  } else {
    let aResaltar = null;
    items.forEach((item, idx) => {
      if (!pasaFiltro(item)) return;   // idx sigue siendo el real, no el de la vista
      const li = document.createElement('li');
      if (resaltado && claveItem(item) === resaltado) {
        li.classList.add('destello');
        aResaltar = li;
      }

      const checkBtn = document.createElement('button');
      checkBtn.type = 'button';
      checkBtn.className = 'check-btn';
      checkBtn.setAttribute('aria-label', item.done ? 'Desmarcar' : 'Marcar');
      const checkbox = document.createElement('span');
      checkbox.className = 'checkbox' + (item.done ? ' done' : '');
      checkbox.textContent = item.done ? '✓' : '';
      checkBtn.appendChild(checkbox);
      checkBtn.onclick = () => toggleItem(idx);

      const body = document.createElement('div');
      body.className = 'item-body';

      const text = document.createElement('div');
      text.className = 'item-text' + (item.done ? ' done' : '');
      text.textContent = item.text;
      text.contentEditable = 'true';
      text.spellcheck = false;
      text.addEventListener('focus', () => text.classList.add('editing'));
      text.addEventListener('blur', () => {
        text.classList.remove('editing');
        const newText = text.textContent.trim();
        const original = items[idx] ? items[idx].text : '';
        if (newText && newText !== original) {
          updateItemText(idx, newText);
        } else {
          text.textContent = original;
          render();
        }
      });
      text.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      });
      body.appendChild(text);

      const meta = document.createElement('div');
      meta.className = 'item-meta';

      const CATS = CATS_();
      const sel = document.createElement('select');
      sel.className = 'cat-select';
      sel.setAttribute('aria-label', 'Categoría');
      const valorActual = catDe(item) + '|' + (subDe(item) || '');
      Object.keys(CATS).forEach(ck => {
        const subs = CATS[ck].subs;
        if (subs) {
          const grupo = document.createElement('optgroup');
          grupo.label = CATS[ck].label;
          Object.keys(subs).forEach(sk => {
            const o = document.createElement('option');
            o.value = ck + '|' + sk;
            o.textContent = CATS[ck].label + ' · ' + subs[sk];
            grupo.appendChild(o);
          });
          sel.appendChild(grupo);
        } else {
          const o = document.createElement('option');
          o.value = ck + '|';
          o.textContent = CATS[ck].label;
          sel.appendChild(o);
        }
      });
      sel.value = valorActual;
      sel.onchange = () => cambiarCategoria(idx, sel.value);
      meta.appendChild(sel);

      if (item.author) {
        const author = document.createElement('span');
        author.className = 'item-author';
        author.textContent = 'apuntado por ' + item.author;
        meta.appendChild(author);
      }
      body.appendChild(meta);

      if (Array.isArray(item.history) && item.history.length > 0) {
        const historyWrap = document.createElement('div');
        historyWrap.className = 'item-history';
        item.history.forEach(h => {
          const entry = document.createElement('div');
          entry.className = 'item-history-entry';
          entry.textContent = h.text;
          historyWrap.appendChild(entry);
        });
        body.appendChild(historyWrap);
      }

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.setAttribute('aria-label', 'Borrar');
      delBtn.textContent = '✕';
      delBtn.onclick = () => deleteItem(idx);

      li.appendChild(checkBtn);
      li.appendChild(body);
      li.appendChild(delBtn);
      list.appendChild(li);
    });

    // Al llegar desde un resultado del buscador, el punto se busca solo
    if (aResaltar) {
      resaltado = null;
      requestAnimationFrame(() => aResaltar.scrollIntoView({ block: 'center', behavior: 'smooth' }));
    }
  }

  const pending = items.filter(i => !i.done).length;
  if (items.length === 0) {
    status.textContent = 'Sin pendientes';
  } else {
    const base = `${pending} pendiente${pending !== 1 ? 's' : ''} de ${items.length}`;
    // Con un filtro puesto hay que decir cuántos se están viendo, o parece que
    // faltan cosas de la lista.
    status.textContent = hayFiltro() ? `${base} · mostrando ${visibles}` : base;
  }
  renderFiltros();
}

/* ---------------------------------------------------------------------------
   Buscador general y repetidos
--------------------------------------------------------------------------- */

// No hay ids en los puntos, así que para volver a encontrar uno después de repintar
// se usa cuándo se apuntó + su texto. Con listas de decenas de puntos basta.
const claveItem = (item) => (item.createdAt || 0) + '|' + item.text;

function tituloSeccion(key) {
  const s = SECTIONS.find(x => x.key === key);
  return s ? s.title : key;
}

// Todos los puntos de las tres listas, cada uno con su sección al lado
function todosLosPuntos() {
  const out = [];
  SECTIONS.forEach(s => (store[s.key] || []).forEach(item => out.push({ item, seccion: s.key })));
  return out;
}

function buscar(texto) {
  const res = [];
  todosLosPuntos().forEach(p => {
    const { score, exacto } = puntuaBusqueda(texto, p.item.text);
    if (score >= UMBRAL_BUSQUEDA) res.push({ item: p.item, seccion: p.seccion, score, exacto });
  });
  res.sort((a, b) => (Number(b.exacto) - Number(a.exacto)) || (b.score - a.score));
  return res;
}

// Los puntos de cualquier lista que se parezcan a un texto
function parecidosA(texto, excluir) {
  return todosLosPuntos()
    .filter(p => p.item !== excluir)
    .map(p => ({ item: p.item, seccion: p.seccion, score: similitud(texto, p.item.text) }))
    .filter(p => p.score >= UMBRAL_PARECIDO)
    .sort((a, b) => b.score - a.score);
}

// Se agrupa por cadenas: si A se parece a B y B a C, los tres van al mismo montón
// aunque A y C no se parezcan tanto entre sí. Para un aviso es lo que interesa.
let cacheGrupos = null;

function gruposRepetidos() {
  if (cacheGrupos && cacheGrupos.version === version) return cacheGrupos.grupos;

  const puntos = todosLosPuntos().filter(p => tokens(p.item.text).length > 0);
  const padre = puntos.map((_, i) => i);
  const raiz = (i) => { while (padre[i] !== i) { padre[i] = padre[padre[i]]; i = padre[i]; } return i; };

  for (let i = 0; i < puntos.length; i++) {
    for (let j = i + 1; j < puntos.length; j++) {
      if (similitud(puntos[i].item.text, puntos[j].item.text) >= UMBRAL_PARECIDO) {
        padre[raiz(i)] = raiz(j);
      }
    }
  }

  const montones = new Map();
  puntos.forEach((p, i) => {
    const r = raiz(i);
    if (!montones.has(r)) montones.set(r, []);
    montones.get(r).push(p);
  });

  const grupos = [...montones.values()].filter(g => g.length > 1);
  // Delante los que están repartidos entre listas distintas: son los que acaban
  // cargándose dos veces en la furgoneta.
  const nListas = g => new Set(g.map(p => p.seccion)).size;
  grupos.sort((a, b) => (nListas(b) - nListas(a)) || (b.length - a.length));

  cacheGrupos = { version, grupos };
  return grupos;
}

function cerrarBusqueda() {
  consulta = '';
  verRepetidos = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').hidden = true;
}

function irAlPunto(p) {
  cerrarBusqueda();
  resaltado = claveItem(p.item);
  if (p.seccion !== currentSection) {
    switchSection(p.seccion);
  } else {
    quitarFiltros();   // si había un filtro que lo dejaba fuera, no se vería al volver
    render();
  }
}

function filaResultado(p, etiqueta) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'res';

  const top = document.createElement('div');
  top.className = 'res-top';
  const sec = document.createElement('span');
  sec.className = 'res-sec';
  sec.textContent = tituloSeccion(p.seccion);
  top.appendChild(sec);
  [etiqueta, p.item.done ? 'Tachado' : null].forEach(t => {
    if (!t) return;
    const tag = document.createElement('span');
    tag.className = 'res-tag';
    tag.textContent = t;
    top.appendChild(tag);
  });
  btn.appendChild(top);

  const texto = document.createElement('span');
  texto.className = 'res-text' + (p.item.done ? ' done' : '');
  texto.textContent = p.item.text;
  btn.appendChild(texto);

  const meta = document.createElement('span');
  meta.className = 'res-meta';
  meta.textContent = nombreCat(p.item, p.seccion) + (p.item.author ? ' · apuntado por ' + p.item.author : '');
  btn.appendChild(meta);

  btn.onclick = () => irAlPunto(p);
  return btn;
}

function renderBotonRepetidos() {
  const btn = document.getElementById('dupesBtn');
  const n = gruposRepetidos().length;
  btn.hidden = n === 0 && !verRepetidos;
  btn.className = 'dupes-btn' + (verRepetidos ? ' active' : '');
  btn.textContent = verRepetidos ? 'Volver a la lista' : 'Artículos que se repiten';
  if (!verRepetidos && n) {
    const c = document.createElement('span');
    c.className = 'dupes-count';
    c.textContent = n;
    btn.appendChild(c);
  }
}

function renderPanel() {
  const panel = document.getElementById('searchPanel');
  panel.innerHTML = '';

  const titulo = document.createElement('div');
  titulo.className = 'panel-title';
  const nota = document.createElement('div');
  nota.className = 'panel-note';
  panel.appendChild(titulo);
  panel.appendChild(nota);

  const vacio = (texto) => {
    const el = document.createElement('div');
    el.className = 'empty';
    el.textContent = texto;
    panel.appendChild(el);
  };

  if (verRepetidos) {
    const grupos = gruposRepetidos();
    titulo.textContent = 'Artículos que se repiten';
    nota.textContent = 'Puntos de las tres listas que parecen el mismo artículo aunque estén escritos de otra forma. Toca uno para ir a su lista.';
    if (!grupos.length) { vacio('Nada repetido, todo en orden'); return; }

    grupos.forEach(g => {
      const caja = document.createElement('div');
      caja.className = 'group';
      const cab = document.createElement('div');
      cab.className = 'group-title';
      const listas = [...new Set(g.map(p => p.seccion))];
      cab.textContent = listas.length > 1
        ? 'En ' + listas.map(tituloSeccion).join(' y ')
        : 'Dentro de ' + tituloSeccion(listas[0]);
      caja.appendChild(cab);
      g.forEach(p => caja.appendChild(filaResultado(p, null)));
      panel.appendChild(caja);
    });
    return;
  }

  const res = buscar(consulta);
  titulo.textContent = res.length + (res.length === 1 ? ' resultado' : ' resultados');
  nota.textContent = 'Buscando en las tres listas. Salen también los que están escritos de otra forma. Toca uno para ir a su lista.';
  if (!res.length) { vacio('Nada que se parezca a «' + consulta.trim() + '»'); return; }
  res.forEach(p => panel.appendChild(filaResultado(p, p.exacto ? null : 'Parecido')));
}

/* Aviso de posible repetido mientras se apunta algo nuevo. Nunca bloquea: solo
   avisa, porque a veces sí que hacen falta dos cosas parecidas. */
let temporizadorHint = null;

function pintarDupHint(parecidos, prefijo) {
  const el = document.getElementById('dupHint');
  clearTimeout(temporizadorHint);
  el.innerHTML = '';
  if (!parecidos.length) { el.style.display = 'none'; return; }

  el.appendChild(document.createTextNode(prefijo));
  parecidos.slice(0, 3).forEach((p, i) => {
    if (i) el.appendChild(document.createTextNode(' · '));
    const link = document.createElement('span');
    link.className = 'dup-link';
    link.textContent = '«' + p.item.text + '» en ' + tituloSeccion(p.seccion);
    link.onclick = () => irAlPunto(p);
    el.appendChild(link);
  });
  el.style.display = 'block';
}

function avisarParecidos(texto, recienAnadido) {
  if (texto.trim().length < 3) { pintarDupHint([], ''); return; }
  const parecidos = parecidosA(texto, recienAnadido);
  pintarDupHint(parecidos, recienAnadido ? 'Ojo, ya había algo parecido: ' : 'Puede que ya esté apuntado: ');
  if (recienAnadido && parecidos.length) {
    temporizadorHint = setTimeout(() => { document.getElementById('dupHint').style.display = 'none'; }, 10000);
  }
}

function avisoAdd(texto) {
  const el = document.getElementById('addNote');
  el.textContent = texto;
  el.style.display = texto ? 'block' : 'none';
  if (texto) setTimeout(() => { el.style.display = 'none'; }, 5000);
}

async function addItem() {
  const name = requireName();
  if (!name) return;

  const input = document.getElementById('newItem');
  const text = input.value.trim();
  if (!text) return;

  const { cat, sub } = clasificar(text);
  const nuevo = { text, done: false, cat, sub, author: name, createdAt: Date.now(), history: [] };
  items.push(nuevo);
  input.value = '';

  // Si el filtro activo lo deja fuera, avisamos en vez de que parezca que no se guardó
  avisoAdd(pasaFiltro(nuevo) ? '' : `Añadido en ${nombreCat(nuevo)}, pero el filtro activo no lo muestra`);
  // Y si ya había algo parecido en cualquiera de las tres listas, se dice — sin
  // impedir apuntarlo: a veces hacen falta las dos cosas.
  avisarParecidos(text, nuevo);

  render();
  await saveItems();
}

async function cambiarCategoria(idx, valor) {
  const name = requireName();
  const item = items[idx];
  if (!name || !item) { render(); return; }

  const [cat, sub] = valor.split('|');
  const antes = nombreCat(item);
  item.cat = cat;
  item.sub = sub || null;
  const despues = nombreCat(item);
  if (antes !== despues) pushHistory(item, `${name} movió "${item.text}" de ${antes} a ${despues}`);
  render();
  await saveItems();
}

async function toggleItem(idx) {
  const name = requireName();
  if (!name) return;
  const item = items[idx];
  if (!item) return;

  item.done = !item.done;
  pushHistory(item, (item.done ? 'Marcado' : 'Desmarcado') + ' por ' + name);
  render();
  await saveItems();
}

async function updateItemText(idx, newText) {
  const name = requireName();
  const item = items[idx];
  if (!name || !item) { render(); return; }

  const oldText = item.text;
  item.text = newText;
  pushHistory(item, name + ' cambió "' + oldText + '" → "' + newText + '"');
  render();
  await saveItems();
}

async function deleteItem(idx) {
  const name = requireName();
  if (!name) return;
  if (!items[idx]) return;

  items.splice(idx, 1);
  render();
  await saveItems();
}

// El nombre se recuerda entre visitas: se abre el link y ya está puesto.
const whoInput = document.getElementById('whoInput');
try {
  const saved = localStorage.getItem(NAME_STORAGE_KEY);
  if (saved) whoInput.value = saved;
} catch (e) { /* navegador con almacenamiento bloqueado: se sigue sin recordar */ }

whoInput.addEventListener('input', () => {
  try { localStorage.setItem(NAME_STORAGE_KEY, whoInput.value.trim()); } catch (e) {}
  if (whoInput.value.trim()) document.getElementById('nameWarning').style.display = 'none';
});
whoInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); whoInput.blur(); }
});

document.getElementById('addBtn').addEventListener('click', addItem);
const newItemInput = document.getElementById('newItem');
newItemInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addItem(); }
});

// Mientras se escribe se va mirando si eso ya está apuntado en alguna lista. Con un
// respiro, para no comparar contra todo en cada tecla.
let temporizadorEscribiendo = null;
newItemInput.addEventListener('input', () => {
  clearTimeout(temporizadorEscribiendo);
  const texto = newItemInput.value;
  temporizadorEscribiendo = setTimeout(() => avisarParecidos(texto, null), 300);
});

document.getElementById('filterReset').addEventListener('click', () => {
  quitarFiltros();
  render();
});

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  consulta = searchInput.value;
  document.getElementById('searchClear').hidden = !consulta;
  if (consulta.trim().length >= 2) verRepetidos = false;   // buscar manda sobre los repetidos
  render();
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); searchInput.blur(); }
  if (e.key === 'Escape') { cerrarBusqueda(); render(); }
});
document.getElementById('searchClear').addEventListener('click', () => {
  cerrarBusqueda();
  searchInput.focus();
  render();
});
document.getElementById('dupesBtn').addEventListener('click', () => {
  const abrir = !verRepetidos;
  cerrarBusqueda();
  verRepetidos = abrir;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderTabs();
renderFiltros();
render();
arrancar();
</script>
