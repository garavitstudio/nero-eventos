<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="description" content="Checklist compartida en tiempo real del equipo de Nero Salamanca para preparar eventos.">
<title>Nero · Eventos — Checklist compartida</title>
<link rel="icon" href="assets/logo-nero.png">
<link rel="apple-touch-icon" href="assets/logo-nero.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Jost', sans-serif;
    background: #0e0e0e;
    background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #0e0e0e 60%);
    background-attachment: fixed;
    margin: 0;
    padding: 34px 18px calc(60px + env(safe-area-inset-bottom));
    color: #e9e4d8;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  .crest { text-align: center; margin-bottom: 2px; }
  .crest img { height: 40px; width: auto; opacity: 0.9; display: inline-block; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 28px;
    text-align: center;
    letter-spacing: 2px;
    margin: 8px 0 2px;
    color: #f4ead2;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #9c9587;
    margin-bottom: 14px;
    font-weight: 300;
  }
  .divider { width: 40px; height: 1px; background: #b08d4f; margin: 18px auto 26px; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 30px;
    border-bottom: 1px solid #24221e;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 12px 4px;
    min-height: 52px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b6459;
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    font-family: 'Jost', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .tab .tab-main { display: block; font-family: 'Playfair Display', serif; font-size: 14px; letter-spacing: 0.5px; text-transform: none; margin-bottom: 2px; }
  .tab.active { color: #f4ead2; border-bottom-color: #b08d4f; }
  .tab.active .tab-main { color: #b08d4f; }

  .section-note {
    text-align: center;
    font-size: 11px;
    font-style: italic;
    color: #6b6459;
    margin-bottom: 20px;
  }

  .who-row { margin-bottom: 18px; }
  .who-label {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #8a8378;
    margin-bottom: 6px;
  }
  input[type=text] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 2px;
    border: 1px solid #2c2a26;
    background: #161513;
    color: #e9e4d8;
    /* 16px evita que iOS haga zoom al enfocar el campo */
    font-size: 16px;
    font-weight: 300;
    font-family: 'Jost', sans-serif;
  }
  input[type=text]::placeholder { color: #5f5a51; }
  input[type=text]:focus { outline: none; border-color: #b08d4f; }

  .add-row { display: flex; gap: 8px; margin-bottom: 26px; }
  .add-row input { flex: 1; min-width: 0; }
  button.add-btn {
    background: transparent;
    color: #b08d4f;
    border: 1px solid #b08d4f;
    border-radius: 2px;
    padding: 0 20px;
    min-height: 48px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.add-btn:hover { background: #b08d4f; color: #0e0e0e; }
  button.add-btn:active { transform: scale(0.97); }

  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    background: #161513;
    border: 1px solid #24221e;
    border-radius: 2px;
    padding: 10px 8px 10px 4px;
    margin-bottom: 10px;
    transition: border-color 0.2s;
  }
  li:hover { border-color: #3a362e; }

  /* El botón es la zona táctil de 44px; el círculo dorado va dentro */
  .check-btn {
    flex-shrink: 0;
    width: 46px;
    min-height: 46px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .checkbox {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid #b08d4f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    color: #0e0e0e;
  }
  .checkbox.done { background: #b08d4f; }

  .item-body { flex: 1; min-width: 0; padding: 4px 0; }

  .item-text {
    font-size: 15px;
    font-weight: 300;
    word-break: break-word;
    line-height: 1.4;
    cursor: text;
    border-bottom: 1px dashed transparent;
  }
  .item-text:hover { border-bottom: 1px dashed #48443c; }
  .item-text.done { text-decoration: line-through; color: #5f5a51; }
  .item-text.editing { outline: none; border-bottom: 1px solid #b08d4f; text-decoration: none; color: #e9e4d8; }

  .item-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
  }
  .item-author {
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #6b6459;
  }

  /* La categoría es un <select> nativo disfrazado de etiqueta: en el móvil abre
     el selector del sistema, que es lo más cómodo con una mano. */
  .cat-select {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    border: 1px solid #2c2a26;
    border-radius: 2px;
    color: #8a8378;
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 16px 4px 7px;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #6b6459 50%), linear-gradient(135deg, #6b6459 50%, transparent 50%);
    background-position: calc(100% - 8px) calc(50% + 1px), calc(100% - 5px) calc(50% + 1px);
    background-size: 3px 3px, 3px 3px;
    background-repeat: no-repeat;
  }
  .cat-select:focus { outline: none; border-color: #b08d4f; color: #b08d4f; }
  .cat-select option, .cat-select optgroup { background: #161513; color: #e9e4d8; }
  .del-btn {
    flex-shrink: 0;
    width: 44px;
    min-height: 44px;
    background: none;
    border: none;
    color: #48443c;
    font-size: 16px;
    cursor: pointer;
    padding: 0;
    font-family: 'Playfair Display', serif;
    -webkit-tap-highlight-color: transparent;
  }
  .del-btn:hover { color: #b08d4f; }

  .empty {
    text-align: center;
    color: #6b6459;
    font-size: 14px;
    font-style: italic;
    padding: 40px 0;
    font-family: 'Playfair Display', serif;
  }

  /* ---- Filtros ---- */
  .filters { margin-bottom: 22px; }

  .filter-label {
    font-size: 9px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #565148;
    margin-bottom: 7px;
  }

  /* Estado: control segmentado a todo el ancho */
  .seg {
    display: flex;
    border: 1px solid #24221e;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .seg button {
    flex: 1;
    min-height: 44px;
    background: transparent;
    border: none;
    border-right: 1px solid #24221e;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: #b08d4f; color: #0e0e0e; }

  /* Categorías: fichas que se ajustan solas */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.sub { margin-top: 8px; padding-left: 14px; border-left: 1px solid #24221e; }
  .chip {
    min-height: 40px;
    padding: 0 14px;
    background: transparent;
    border: 1px solid #24221e;
    border-radius: 2px;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip .chip-count { color: #48443c; margin-left: 5px; }
  .chip.active { border-color: #b08d4f; color: #f4ead2; }
  .chip.active .chip-count { color: #b08d4f; }
  .chip:disabled { opacity: 0.35; cursor: default; }

  .filter-reset {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: #6b6459;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: underline;
    cursor: pointer;
    min-height: 32px;
  }
  .filter-reset:hover { color: #b08d4f; }

  .add-note {
    display: none;
    font-size: 11px;
    color: #c17d5a;
    font-style: italic;
    margin: -18px 0 20px;
    text-align: center;
  }

  .status {
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #6b6459;
    margin-top: 26px;
  }

  .hint {
    text-align: center;
    font-size: 10px;
    color: #4c473f;
    margin-top: 6px;
    font-style: italic;
  }

  .name-warning {
    display: none;
    font-size: 11px;
    color: #c17d5a;
    margin-top: 6px;
    font-style: italic;
  }

  .item-history {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #24221e;
  }
  .item-history-entry {
    font-size: 10px;
    color: #565148;
    line-height: 1.6;
  }

  .conn-status {
    text-align: center;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #4c473f;
  }
  .conn-status.error { color: #c17d5a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crest">
    <img src="assets/logo-nero.png" alt="Nero Salamanca">
  </div>
  <h1>Nero · Eventos</h1>
  <div class="sub">Checklist compartida del equipo</div>
  <div class="conn-status" id="connStatus">Conectando...</div>
  <div class="divider"></div>

  <div class="tabs" id="tabs"></div>
  <div class="section-note" id="sectionNote"></div>

  <div class="who-row">
    <div class="who-label">Tu nombre</div>
    <input type="text" id="whoInput" placeholder="Ej: Selu" autocomplete="name" enterkeyhint="done" />
    <div class="name-warning" id="nameWarning">Pon tu nombre antes de apuntar algo</div>
  </div>

  <div class="add-row">
    <input type="text" id="newItem" placeholder="Añadir un punto a la lista..." enterkeyhint="done" />
    <button class="add-btn" id="addBtn" type="button">Añadir</button>
  </div>
  <div class="add-note" id="addNote"></div>

  <div class="filters">
    <div class="seg" id="filterEstado"></div>
    <div class="filter-label">Filtrar por tipo</div>
    <div class="chips" id="filterCat"></div>
    <div class="chips sub" id="filterSub" hidden></div>
    <button class="filter-reset" id="filterReset" type="button" hidden>Quitar filtros</button>
  </div>

  <ul id="list"></ul>
  <div class="status" id="status">Cargando...</div>
  <div class="hint">Toca el texto de un punto para editar la cantidad</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, onSnapshot, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Claves públicas de cliente. No son secretos: Firebase las expone por diseño en
// el navegador y la seguridad real vive en las reglas de Firestore (ver README).
const firebaseConfig = {
  apiKey: "AIzaSyBIv43-_3Mvn0mEPXO-yPU63NskYufUYaw",
  authDomain: "nero-eventos.firebaseapp.com",
  projectId: "nero-eventos",
  storageBucket: "nero-eventos.firebasestorage.app",
  messagingSenderId: "952289724967",
  appId: "1:952289724967:web:a5a818e2d7e3a1c2d3dc02"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Para añadir o renombrar una pestaña, toca solo este array.
const SECTIONS = [
  { key: 'general',    title: 'General',    label: 'General',      cats: 'sala',   note: '(material y suministros generales del evento)' },
  { key: 'cocteleria', title: 'Coctelería', label: 'José Alexis',  cats: 'sala',   note: '(por si quieren apuntar algo, desgraciados)' },
  { key: 'cocina',     title: 'Cocina',     label: 'Jordan',       cats: 'cocina', note: '(por si quieren apuntar algo, desgraciados)' }
];

const NAME_STORAGE_KEY = 'nero-eventos:nombre';

// Categorías, por juego. Sala (general y coctelería) y cocina no tienen nada que ver:
// lo que a Jordan le sirve es máquinas / género / menaje, no vinos y licores.
// Para añadir una categoría basta con meterla aquí: aparece sola en los filtros y en
// el selector de cada punto. `subs: null` = sin subfiltros.
const CATS_SALA = {
  bebidas:    { label: 'Bebidas',    subs: { refrescos: 'Refrescos', vinos: 'Vinos', licores: 'Licores', otros: 'Otras' } },
  utensilios: { label: 'Utensilios', subs: null },
  otros:      { label: 'Otros',      subs: null }
};

const CATS_COCINA = {
  genero:     { label: 'Género',     subs: { salsas: 'Salsas', charcuteria: 'Charcutería', congelados: 'Congelados', otros: 'Otros' } },
  maquinas:   { label: 'Máquinas',   subs: null },
  utensilios: { label: 'Utensilios', subs: null },
  menaje:     { label: 'Menaje',     subs: null },
  limpieza:   { label: 'Limpieza',   subs: null },
  otros:      { label: 'Otros',      subs: null }
};

// Reglas de clasificación automática para lo que se apunte de nuevo. Se miran en
// orden y gana la primera que encaje, así que lo más específico va arriba.
const REGLAS_SALA = [
  { cat: 'bebidas', sub: 'licores', kw: ['ron','barcelo','bacardi','ginebra','gin','beefeater','tanqueray','larios','seagrams','whisky','whiskey','ballantines','jb','dyc','vodka','absolut','smirnoff','martini','vermut','vermouth','licor','tequila','brandy','conac','cognac','orujo','pacharan','anis','cointreau','curacao','amaretto','baileys','jager','absenta','cazalla','ponche','chinchon'] },
  { cat: 'bebidas', sub: 'vinos',     kw: ['vino','vinos','verdejo','yllera','hillera','tinto','tintos','blanco','rioja','ribera','albarino','rueda','cava','champagne','champan','espumoso','rosado','crianza','reserva','godello','tempranillo','moscatel','sidra','sangria','tinto de verano'] },
  { cat: 'bebidas', sub: 'refrescos', kw: ['agua','aguas','pepsi','coca','cola','tonica','tonicas','fanta','sprite','refresco','refrescos','zumo','zumos','nestea','aquarius','bitter','kas','schweppes','trina','gaseosa','limonada','mosto','energetica','isotonica'] },
  // La cerveza no es refresco ni licor ni vino, así que cae en "Otras bebidas"
  { cat: 'bebidas', sub: 'otros',     kw: ['cerveza','cervezas','birra','clara','bebida','bebidas','botella','botellas','barril'] },
  { cat: 'utensilios', sub: null, kw: ['vaso','vasos','copa','copas','cubilete','cubiletes','chupito','chupitos','cubierto','cubiertos','tenedor','tenedores','cuchillo','cuchillos','cuchara','cucharas','cucharita','cucharilla','servilleta','servilletas','mantel','manteles','bandeja','bandejas','cubitera','cubiteras','pinza','pinzas','palillo','palillos','coctelera','jarra','jarras','abridor','descorchador','sacacorchos','colador','cubo','cubos','bayeta','bayetas','balleta','balletas','trapo','trapos','delantal','plato','platos','fuente','cuenco','bol','dosificador','posavasos','pajita','pajitas','canita','canitas','removedor','hielera','botellero','tabla','exprimidor','jigger','medidor','papel','rollo','bolsa','bolsas','limpia','limpiamanos','toallita','toallitas','mechero','encendedor','velas','cinta','tijeras','rotulador'] },
  { cat: 'otros', sub: null, kw: ['fruta','frutas','naranja','naranjas','limon','limones','lima','limas','menta','hierbabuena','hielo','sal','pimienta','azucar','especia','especias','condimento','aceite','vinagre','salsa','decoracion','adorno','flores'] }
];

// Ojo con el orden aquí: "Platos jamón" es menaje, no charcutería, así que menaje va
// antes que género. Y "jamonero" es máquina, por eso máquinas va de las primeras.
const REGLAS_COCINA = [
  { cat: 'genero', sub: 'salsas', kw: ['salsa','salsas','biberon','biberones','mayonesa','ketchup','mostaza','siracha','sriracha','alioli','vinagreta','bbq','barbacoa','emulsion'] },
  { cat: 'maquinas', sub: null, kw: ['plancha','freidora','tostadora','jamonero','horno','microondas','nevera','arcon','congelador','cafetera','lavavajillas','campana','gratinadora','abatidor','cortadora','envasadora','batidora','termomix','vitro','fogon','fogones','bombona'] },
  { cat: 'menaje', sub: null, kw: ['plato','platos','vaso','vasos','copa','copas','chupito','chupitos','taza','tazas','fuente','fuentes','bandeja','bandejas','cubierto','cubiertos','portacubiertos','porta','servilletero','servilleteros','servilleta','servilletas','mantel','manteles','jarra','jarras','cuenco','bol','posavasos','vajilla','cristaleria'] },
  { cat: 'utensilios', sub: null, kw: ['tabla','tablas','cuchillo','cuchillos','manta','mantas','espatula','espatulas','pinza','pinzas','abridor','abridores','sacacorchos','corchos','medidor','jigger','coctelera','escurridor','colador','exprimidor','cazo','cazos','sarten','sartenes','olla','ollas','pelador','rallador','tijeras','cucharon','espumadera','termometro','tupper','tuppers','gastronorm','cubitera','hielera','palillo','palillos','mortero','embudo','pinchos','brochetas'] },
  { cat: 'limpieza', sub: null, kw: ['papel','rollo','bolsa','bolsas','basura','balleta','balletas','bayeta','bayetas','lito','litos','trapo','trapos','estropajo','detergente','lejia','guantes','film','aluminio','delantal','fregona','cubo','desengrasante'] },
  { cat: 'genero', sub: 'congelados', kw: ['croqueta','croquetas','minihamburguesa','minihamburguesas','hamburguesa','hamburguesas','congelado','congelados','nugget','nuggets','empanadilla','empanadillas','tequenos'] },
  { cat: 'genero', sub: 'charcuteria', kw: ['jamon','lomo','iberico','ibericos','queso','quesos','quezo','quezos','brie','chorizo','salchichon','embutido','embutidos','cecina','curado','paleta','mortadela','pate'] },
  { cat: 'genero', sub: 'otros', kw: ['pan','panes','picos','tosta','tostas','tostada','tostadas','mermelada','cebolla','caramelizada','bocadillo','bocadillos','fruta','limon','limones','naranja','naranjas','aceite','vinagre','sal','pimienta','azucar','huevo','huevos','verdura','verduras','carne','pescado','marisco','bacalao','ensalada','patata','patatas','arroz','pasta','especia','especias','genero','comida'] }
];

const CAT_SETS = {
  sala:   { cats: CATS_SALA,   reglas: REGLAS_SALA },
  cocina: { cats: CATS_COCINA, reglas: REGLAS_COCINA }
};

// El juego de categorías depende de la pestaña abierta
function juegoActual() {
  const s = SECTIONS.find(x => x.key === currentSection);
  return CAT_SETS[(s && s.cats) || 'sala'];
}
function CATS_() { return juegoActual().cats; }

function normalizar(t) {
  return (t || '').toLowerCase()
    .replace(/[áàäâ]/g, 'a').replace(/[éèëê]/g, 'e').replace(/[íìïî]/g, 'i')
    .replace(/[óòöô]/g, 'o').replace(/[úùüû]/g, 'u')
    .replace(/ñ/g, 'n').replace(/ç/g, 'c');
}

// Clasifica por palabras completas: así "colador" no cae en refrescos por "cola",
// ni "salsa" en otros por "sal".
function clasificar(text, juego) {
  const reglas = (juego || juegoActual()).reglas;
  const t = normalizar(text);
  for (const regla of reglas) {
    for (const kw of regla.kw) {
      if (new RegExp('\\b' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t)) {
        return { cat: regla.cat, sub: regla.sub };
      }
    }
  }
  return { cat: 'otros', sub: null };   // "otros" existe en todos los juegos
}

// Los puntos apuntados antes de que existieran los filtros no tienen categoría
// guardada: se les calcula al vuelo, sin escribir en Firestore (si no, cada móvil
// que abriera la app dispararía una escritura).
function catDe(item) {
  const CATS = CATS_();
  // Una categoría guardada que no exista en esta pestaña (p. ej. "bebidas" en cocina)
  // se ignora y se reclasifica con las reglas de aquí.
  if (item.cat && CATS[item.cat]) return item.cat;
  return clasificar(item.text).cat;
}
function subDe(item) {
  const CATS = CATS_();
  const cat = catDe(item);
  if (!CATS[cat].subs) return null;
  if (item.cat === cat && item.sub && CATS[cat].subs[item.sub]) return item.sub;
  const auto = clasificar(item.text);
  return auto.cat === cat && auto.sub ? auto.sub : 'otros';
}
function nombreCat(item) {
  const CATS = CATS_();
  const cat = catDe(item), sub = subDe(item);
  return CATS[cat].label + (sub ? ' · ' + CATS[cat].subs[sub] : '');
}

let currentSection = SECTIONS[0].key;
let items = [];
let unsubscribe = null;
let listenerToken = 0;   // evita que un listener viejo pinte sobre la pestaña nueva

// saliera media lista por un filtro de la última vez, pensaría que faltan cosas.
let fEstado = 'todos';   // todos | pendientes | tachados
let fCat = 'todas';
let fSub = 'todas';

const SEEDS = { general: SEED_GENERAL, cocteleria: SEED_COCTELERIA, cocina: SEED_COCINA };

const AUTORES = { general: 'Selu', cocteleria: 'Selu', cocina: 'Jordan' };

function seedFor(sectionKey) {
  const seed = SEEDS[sectionKey];
  if (!seed) return [];
  const now = Date.now();
  return seed.map(i => ({ ...i, author: AUTORES[sectionKey] || 'Selu', createdAt: now, history: [] }));
}

function docRefFor(sectionKey) {
  return doc(db, 'checklists', sectionKey);
}

function setConnStatus(text, isError) {
  const el = document.getElementById('connStatus');
  el.textContent = text;
  el.className = 'conn-status' + (isError ? ' error' : '');
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  SECTIONS.forEach(s => {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'tab' + (s.key === currentSection ? ' active' : '');
    const main = document.createElement('span');
    main.className = 'tab-main';
    main.textContent = s.title;
    tab.appendChild(main);
    tab.appendChild(document.createTextNode(s.label));
    tab.onclick = () => switchSection(s.key);
    tabsEl.appendChild(tab);
  });
  const active = SECTIONS.find(s => s.key === currentSection);
  document.getElementById('sectionNote').textContent = active.note;
}

function quitarFiltros() {
  fEstado = 'todos';
  fCat = 'todas';
  fSub = 'todas';
  renderFiltros();
}

function switchSection(key) {
  if (key === currentSection) return;
  currentSection = key;
  items = [];
  // Cada pestaña es una lista distinta: arrastrar el filtro de la anterior solo
  // consigue que parezca vacía sin motivo.
  quitarFiltros();
  renderTabs();
  render();
  attachListener();
}

async function attachListener() {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }

  const token = ++listenerToken;
  const section = currentSection;
  const ref = docRefFor(section);

  // Si el documento aún no existe, se crea con su semilla. En transacción para
  // que dos móviles abriendo a la vez no se pisen la lista inicial.
  try {
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists()) tx.set(ref, { items: seedFor(section) });
    });
  } catch (e) {
    setConnStatus('Error de conexión con Firebase', true);
  }

  if (token !== listenerToken) return;   // el usuario ya cambió de pestaña

  unsubscribe = onSnapshot(ref, (snap) => {
    if (token !== listenerToken) return;
    items = (snap.exists() && snap.data().items) || [];
    setConnStatus('Sincronizado en tiempo real', false);
    render();
  }, () => {
    if (token !== listenerToken) return;
    setConnStatus('Error de conexión con Firebase', true);
  });
}

async function saveItems() {
  try {
    await setDoc(docRefFor(currentSection), { items });
  } catch (e) {
    document.getElementById('status').textContent = 'Error al guardar. Intenta de nuevo.';
  }
}

function currentName() {
  return document.getElementById('whoInput').value.trim();
}

function requireName() {
  const name = currentName();
  const warning = document.getElementById('nameWarning');
  if (!name) {
    warning.style.display = 'block';
    document.getElementById('whoInput').focus();
    return null;
  }
  warning.style.display = 'none';
  return name;
}

function pushHistory(item, text) {
  if (!Array.isArray(item.history)) item.history = [];
  item.history.push({ text, at: Date.now() });
}

function pasaFiltro(item) {
  if (fEstado === 'pendientes' && item.done) return false;
  if (fEstado === 'tachados' && !item.done) return false;
  if (fCat !== 'todas' && catDe(item) !== fCat) return false;
  if (fCat === 'bebidas' && fSub !== 'todas' && subDe(item) !== fSub) return false;
  return true;
}

function hayFiltro() {
  return fEstado !== 'todos' || fCat !== 'todas' || fSub !== 'todas';
}

// Cuenta cuántos puntos caerían en una categoría con el filtro de estado puesto,
// para poder enseñar el número en cada ficha.
function cuenta(fn) {
  return items.filter(i => {
    if (fEstado === 'pendientes' && i.done) return false;
    if (fEstado === 'tachados' && !i.done) return false;
    return fn(i);
  }).length;
}

function renderFiltros() {
  const CATS = CATS_();
  const seg = document.getElementById('filterEstado');
  seg.innerHTML = '';
  [['todos', 'Todos'], ['pendientes', 'Pendientes'], ['tachados', 'Tachados']].forEach(([k, label]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = fEstado === k ? 'active' : '';
    btn.textContent = label;
    btn.onclick = () => { fEstado = k; renderFiltros(); render(); };
    seg.appendChild(btn);
  });

  const catsEl = document.getElementById('filterCat');
  catsEl.innerHTML = '';
  const ficha = (activa, label, n, onClick) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (activa ? ' active' : '');
    btn.textContent = label;
    const c = document.createElement('span');
    c.className = 'chip-count';
    c.textContent = n;
    btn.appendChild(c);
    btn.disabled = n === 0 && !activa;
    btn.onclick = onClick;
    return btn;
  };

  catsEl.appendChild(ficha(fCat === 'todas', 'Todas', cuenta(() => true), () => {
    fCat = 'todas'; fSub = 'todas'; renderFiltros(); render();
  }));
  Object.keys(CATS).forEach(k => {
    catsEl.appendChild(ficha(fCat === k, CATS[k].label, cuenta(i => catDe(i) === k), () => {
      fCat = k; fSub = 'todas'; renderFiltros(); render();
    }));
  });

  // La fila de subfiltros solo tiene sentido dentro de una categoría que las tenga
  const subEl = document.getElementById('filterSub');
  const subs = fCat !== 'todas' && CATS[fCat] ? CATS[fCat].subs : null;
  subEl.hidden = !subs;
  subEl.innerHTML = '';
  if (subs) {
    subEl.appendChild(ficha(fSub === 'todas', 'Todas', cuenta(i => catDe(i) === fCat), () => {
      fSub = 'todas'; renderFiltros(); render();
    }));
    Object.keys(subs).forEach(sk => {
      subEl.appendChild(ficha(fSub === sk, subs[sk], cuenta(i => catDe(i) === fCat && subDe(i) === sk), () => {
        fSub = sk; renderFiltros(); render();
      }));
    });
  }

  document.getElementById('filterReset').hidden = !hayFiltro();
}

function render() {
  const list = document.getElementById('list');
  const status = document.getElementById('status');

  // Si alguien está escribiendo en un punto o tiene abierto el selector de
  // categoría, no repintamos: le borraríamos lo que está haciendo cuando llega
  // un cambio de otro móvil.
  const active = document.activeElement;
  if (active && active.classList &&
      (active.classList.contains('item-text') || active.classList.contains('cat-select'))) return;

  list.innerHTML = '';
  const visibles = items.filter(pasaFiltro).length;

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada por aquí todavía';
    list.appendChild(empty);
  } else if (visibles === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Nada en este filtro';
    list.appendChild(empty);
  } else {
    items.forEach((item, idx) => {
      if (!pasaFiltro(item)) return;   // idx sigue siendo el real, no el de la vista
      const li = document.createElement('li');

      const checkBtn = document.createElement('button');
      checkBtn.type = 'button';
      checkBtn.className = 'check-btn';
      checkBtn.setAttribute('aria-label', item.done ? 'Desmarcar' : 'Marcar');
      const checkbox = document.createElement('span');
      checkbox.className = 'checkbox' + (item.done ? ' done' : '');
      checkbox.textContent = item.done ? '✓' : '';
      checkBtn.appendChild(checkbox);
      checkBtn.onclick = () => toggleItem(idx);

      const body = document.createElement('div');
      body.className = 'item-body';

      const text = document.createElement('div');
      text.className = 'item-text' + (item.done ? ' done' : '');
      text.textContent = item.text;
      text.contentEditable = 'true';
      text.spellcheck = false;
      text.addEventListener('focus', () => text.classList.add('editing'));
      text.addEventListener('blur', () => {
        text.classList.remove('editing');
        const newText = text.textContent.trim();
        const original = items[idx] ? items[idx].text : '';
        if (newText && newText !== original) {
          updateItemText(idx, newText);
        } else {
          text.textContent = original;
          render();
        }
      });
      text.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); text.blur(); }
      });
      body.appendChild(text);

      const meta = document.createElement('div');
      meta.className = 'item-meta';

      const CATS = CATS_();
      const sel = document.createElement('select');
      sel.className = 'cat-select';
      sel.setAttribute('aria-label', 'Categoría');
      const valorActual = catDe(item) + '|' + (subDe(item) || '');
      Object.keys(CATS).forEach(ck => {
        const subs = CATS[ck].subs;
        if (subs) {
          const grupo = document.createElement('optgroup');
          grupo.label = CATS[ck].label;
          Object.keys(subs).forEach(sk => {
            const o = document.createElement('option');
            o.value = ck + '|' + sk;
            o.textContent = CATS[ck].label + ' · ' + subs[sk];
            grupo.appendChild(o);
          });
          sel.appendChild(grupo);
        } else {
          const o = document.createElement('option');
          o.value = ck + '|';
          o.textContent = CATS[ck].label;
          sel.appendChild(o);
        }
      });
      sel.value = valorActual;
      sel.onchange = () => cambiarCategoria(idx, sel.value);
      meta.appendChild(sel);

      if (item.author) {
        const author = document.createElement('span');
        author.className = 'item-author';
        author.textContent = 'apuntado por ' + item.author;
        meta.appendChild(author);
      }
      body.appendChild(meta);

      if (Array.isArray(item.history) && item.history.length > 0) {
        const historyWrap = document.createElement('div');
        historyWrap.className = 'item-history';
        item.history.forEach(h => {
          const entry = document.createElement('div');
          entry.className = 'item-history-entry';
          entry.textContent = h.text;
          historyWrap.appendChild(entry);
        });
        body.appendChild(historyWrap);
      }

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'del-btn';
      delBtn.setAttribute('aria-label', 'Borrar');
      delBtn.textContent = '✕';
      delBtn.onclick = () => deleteItem(idx);

      li.appendChild(checkBtn);
      li.appendChild(body);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  const pending = items.filter(i => !i.done).length;
  if (items.length === 0) {
    status.textContent = 'Sin pendientes';
  } else {
    const base = `${pending} pendiente${pending !== 1 ? 's' : ''} de ${items.length}`;
    // Con un filtro puesto hay que decir cuántos se están viendo, o parece que
    // faltan cosas de la lista.
    status.textContent = hayFiltro() ? `${base} · mostrando ${visibles}` : base;
  }
  renderFiltros();
}

function avisoAdd(texto) {
  const el = document.getElementById('addNote');
  el.textContent = texto;
  el.style.display = texto ? 'block' : 'none';
  if (texto) setTimeout(() => { el.style.display = 'none'; }, 5000);
}

async function addItem() {
  const name = requireName();
  if (!name) return;

  const input = document.getElementById('newItem');
  const text = input.value.trim();
  if (!text) return;

  const { cat, sub } = clasificar(text);
  const nuevo = { text, done: false, cat, sub, author: name, createdAt: Date.now(), history: [] };
  items.push(nuevo);
  input.value = '';

  // Si el filtro activo lo deja fuera, avisamos en vez de que parezca que no se guardó
  avisoAdd(pasaFiltro(nuevo) ? '' : `Añadido en ${nombreCat(nuevo)}, pero el filtro activo no lo muestra`);

  render();
  await saveItems();
}

async function cambiarCategoria(idx, valor) {
  const name = requireName();
  const item = items[idx];
  if (!name || !item) { render(); return; }

  const [cat, sub] = valor.split('|');
  const antes = nombreCat(item);
  item.cat = cat;
  item.sub = sub || null;
  const despues = nombreCat(item);
  if (antes !== despues) pushHistory(item, `${name} movió "${item.text}" de ${antes} a ${despues}`);
  render();
  await saveItems();
}

async function toggleItem(idx) {
  const name = requireName();
  if (!name) return;
  const item = items[idx];
  if (!item) return;

  item.done = !item.done;
  pushHistory(item, (item.done ? 'Marcado' : 'Desmarcado') + ' por ' + name);
  render();
  await saveItems();
}

async function updateItemText(idx, newText) {
  const name = requireName();
  const item = items[idx];
  if (!name || !item) { render(); return; }

  const oldText = item.text;
  item.text = newText;
  pushHistory(item, name + ' cambió "' + oldText + '" → "' + newText + '"');
  render();
  await saveItems();
}

async function deleteItem(idx) {
  const name = requireName();
  if (!name) return;
  if (!items[idx]) return;

  items.splice(idx, 1);
  render();
  await saveItems();
}

// El nombre se recuerda entre visitas: se abre el link y ya está puesto.
const whoInput = document.getElementById('whoInput');
try {
  const saved = localStorage.getItem(NAME_STORAGE_KEY);
  if (saved) whoInput.value = saved;
} catch (e) { /* navegador con almacenamiento bloqueado: se sigue sin recordar */ }

whoInput.addEventListener('input', () => {
  try { localStorage.setItem(NAME_STORAGE_KEY, whoInput.value.trim()); } catch (e) {}
  if (whoInput.value.trim()) document.getElementById('nameWarning').style.display = 'none';
});
whoInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); whoInput.blur(); }
});

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('newItem').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addItem(); }
});

document.getElementById('filterReset').addEventListener('click', () => {
  quitarFiltros();
  render();
});

renderTabs();
renderFiltros();
attachListener();
</script>
